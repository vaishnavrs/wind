
services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: windsight-backend
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    restart: unless-stopped


 

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: windsight-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped
